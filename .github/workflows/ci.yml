name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Cache fetched PDF corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sejm-pdfs-${{ hashFiles('data/sources.toml') }}

      - name: Fetch source documents
        run: uv run python -m raglab.ingest fetch

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q
