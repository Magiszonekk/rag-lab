name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Cache fetched PDF corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sejm-pdfs-${{ hashFiles('data/sources.toml') }}

      - name: Fetch source documents
        run: uv run python -m raglab.ingest fetch

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # korpus (pobranie PDF-ów z API Sejmu + parsowanie) — potrzebny testom verify i bramce wyszukiwania
      - name: Build corpus
        run: uv run python -m raglab.ingest build > /dev/null

      - name: Test
        run: uv run pytest -q

      # Bramka jakości (koncept D8): deterministyczne metryki wyszukiwania, bez LLM i bez kluczy.
      # Tylko konfiguracje BM25 — embeddingi na CPU w CI trwałyby ~15 min; wektory mierzy pełna ewaluacja.
      - name: Retrieval quality gate (recall@5 vs baseline)
        run: |
          uv run python -m raglab.search.evaluate --configs bm25-none bm25-morfeusz2 fixed-bm25-morfeusz2 --ci-gate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
