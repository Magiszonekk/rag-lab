# RAG Lab — nginx na OVH. Port 443 to stream/ssl_preread → vhosty HTTPS na :4099 (nigdy listen 443).
limit_req_zone $binary_remote_addr zone=raglab_ask:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=raglab_read:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rag.cikowice.pl api.rag.cikowice.pl;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# frontend: statyczne SPA (web/dist), routing po hashu
server {
    listen 4099 ssl;
    listen [::]:4099 ssl;
    server_name rag.cikowice.pl;
    root /var/www/rag.cikowice.pl;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.rag.cikowice.pl; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self' https://dashboard.cikowice.pl" always;
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
    ssl_certificate /etc/letsencrypt/live/rag.cikowice.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.cikowice.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# API: tylko ścieżki potrzebne frontendowi, reszta 403 (polityka portów, D10)
server {
    listen 4099 ssl;
    listen [::]:4099 ssl;
    server_name api.rag.cikowice.pl;
    client_max_body_size 16k;

    location ~ ^/(ask|compare)$ {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=raglab_ask burst=3 nodelay;
        limit_req_status 429;
        proxy_read_timeout 240s;
        include /etc/nginx/snippets/raglab-proxy.conf;
    }
    location ~ "^/(health|examples|corpus|eval/results|trace/[A-Za-z0-9]{1,32})$" {
        limit_except GET OPTIONS { deny all; }
        limit_req zone=raglab_read burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/raglab-proxy.conf;
    }
    location / { return 403; }

    ssl_certificate /etc/letsencrypt/live/rag.cikowice.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.cikowice.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
