# Bramka modeli RAG Lab (koncept D11). Backend woła WYŁĄCZNIE tę bramkę, nigdy upstreamu bezpośrednio.
# Upstream: OpenAI-compatible gateway z osobnym kluczem RAG Lab (LLM_BASE_URL / LLM_API_KEY z .env).
#
# Wirtualne klucze (tworzone przez /key/generate po starcie, nie w tym pliku):
#   rag-lab-demo — budżet USD/mies., RPM/TPM, models: TYLKO grupa "demo-answer" (od 2026-10-27 główny model to
#     Claude Sonnet 5.5 z decyzji właściciela — świadomy wyjątek od pierwotnego D11 „tylko klucze API”;
#     ograniczenia: 100 pytań/dzień w API, 10/h z IP, RPM/TPM i budżet USD na kluczu, zapas: modele darmowe);
#   rag-lab-eval — ruch właściciela (ewaluacja, sędzia), models: "eval-*".
# Testy przed ruchem publicznym (D11): demo-key → model eval-* = odmowa; przekroczony budżet = odmowa.

model_list:
  # --- demo: tylko modele z kluczy API (lista do potwierdzenia przez właściciela, ask-owner #80) ---
  - model_name: demo-answer
    litellm_params:
      model: os.environ/DEMO_UPSTREAM_MODEL   # pełna nazwa z prefiksem dostawcy, np. openai/gemini-3.6-flash
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY
    # LiteLLM nie zna cen modeli za bramką OpenAI-compatible → liczy koszt 0 i budżet NIE działa (zmierzone).
    # Ceny jawne (USD za token) = cennik API Claude Sonnet ($3 / $15 za 1M) — budżet klucza liczy realną wartość
    # ruchu, nawet jeśli upstream rozlicza go z subskrypcji.
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  # główny model demo: DEMO_UPSTREAM_MODEL (2026-10-27: claude-sonnet-5-5; mierzone na żywo: Gemini Flash 8–150 s na
  # wywołanie z powodu limitów). Zapas z innych źródeł limitów: Gemini Flash (Google), DeepSeek (opencode), Nemotron (OpenRouter free).
  - model_name: demo-answer-fallback-1
    litellm_params:
      model: openai/gemini-3-flash-preview
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025
  - model_name: demo-answer-fallback-2
    litellm_params:
      model: openai/deepseek-v4.1-flash-free
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025
  - model_name: demo-answer-fallback-3
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025
  # tylko do testu zapasów (gateway test): model, którego upstream nie zna → zawsze błąd
  - model_name: demo-broken-test
    litellm_params:
      model: openai/nie-istnieje-raglab-test
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY
  # --- ewaluacja: modele z upstreamu, łącznie z subskrypcyjnymi (ruch tylko właściciela) ---
  - model_name: eval-answer
    litellm_params:
      model: openai/claude-sonnet-5
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY
  - model_name: eval-judge
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: os.environ/LLM_BASE_URL
      api_key: os.environ/LLM_API_KEY

litellm_settings:
  drop_params: true
  # demo: przy 429/błędzie modelu głównego — zapas (w demo liczy się dostępność; ewaluacja nie używa grupy demo)
  fallbacks:
    - demo-answer: ["demo-answer-fallback-1", "demo-answer-fallback-2", "demo-answer-fallback-3"]
    - demo-broken-test: ["demo-answer-fallback-1", "demo-answer-fallback-2", "demo-answer-fallback-3"]
  num_retries: 1
  request_timeout: 90
  # nie wysyłać nic poza bramkę (telemetria, callbacki)
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_spend_logs: false
