{{- if .Values.networkPolicy.enabled }}
# Tylko API przyjmuje ruch spoza chartu. Postgres: z API, Jobów i LiteLLM. LiteLLM: tylko z API i Jobów.
{{- $sel := dict "app.kubernetes.io/name" (include "raglab.name" .) "app.kubernetes.io/instance" .Release.Name }}
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "raglab.fullname" . }}-postgres
  labels: {{- include "raglab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "raglab.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml $sel | nindent 14 }}
      ports: [{port: 5432}]
---
{{- end }}
{{- if .Values.litellm.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "raglab.fullname" . }}-litellm
  labels: {{- include "raglab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "raglab.selector" (dict "ctx" . "component" "litellm") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml $sel | nindent 14 }}
      ports: [{port: {{ .Values.litellm.port }}}]
{{- end }}
{{- end }}
