{{- if .Values.ingest.enabled }}
# Ingest: PDF-y z API Sejmu (sha256 sprawdzane) → korpus JSON na wolumenie. Zwykły Job z numerem rewizji
# w nazwie (nie hook): `helm install --wait --wait-for-jobs` czeka na niego bez zakleszczenia z gotowością API.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "raglab.fullname" . }}-ingest-{{ .Release.Revision }}
  labels: {{- include "raglab.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  backoffLimit: {{ .Values.ingest.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.ingest.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "raglab.selector" (dict "ctx" . "component" "ingest") | nindent 8 }}
        {{- include "raglab.dataLabel" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "raglab.dataAffinity" . | nindent 6 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      {{- include "raglab.podIdentity" . | nindent 6 }}
      containers:
        - name: ingest
          image: {{ include "raglab.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # katalogi na świeżym wolumenie (dowiązania data/raw, data/corpus, data/cache w obrazie wskazują na /data)
          command: ["sh", "-c", "mkdir -p /data/raw /data/corpus /data/cache /data/answers /data/series && python -m raglab.ingest fetch && python -m raglab.ingest build > /dev/null && ls -la /data/corpus{{ if .Values.ingest.embed }} && python -m raglab.ingest embed{{ end }}"]
          {{- if .Values.ingest.embed }}
          env:
            - name: RAGLAB_EMBED
              value: {{ .Values.api.embed | quote }}
            - name: OPENROUTER_API_KEY
              valueFrom: {secretKeyRef: {name: {{ include "raglab.secretName" . }}, key: OPENROUTER_API_KEY, optional: true}}
            - {name: OMP_NUM_THREADS, value: {{ .Values.ingest.embedThreads | quote }}}
            - {name: MKL_NUM_THREADS, value: {{ .Values.ingest.embedThreads | quote }}}
          {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.ingest.resources | nindent 12 }}
          volumeMounts: {{- include "raglab.dataMounts" . | nindent 12 }}
      volumes: {{- include "raglab.dataVolumes" . | nindent 8 }}
{{- end }}
