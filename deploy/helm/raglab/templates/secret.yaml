{{- if not .Values.secrets.existingSecret }}
{{- /* Hasła wygenerowane przy pierwszej instalacji zostają przy upgrade (lookup istniejącego Secretu). */}}
{{- $name := include "raglab.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $c := .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "raglab.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $c.POSTGRES_PASSWORD | default (get $old "POSTGRES_PASSWORD" | default "" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  LITELLM_MASTER_KEY: {{ $c.LITELLM_MASTER_KEY | default (get $old "LITELLM_MASTER_KEY" | default "" | b64dec) | default (printf "sk-%s" (randAlphaNum 40)) | b64enc | quote }}
  {{- range $k := list "LLM_API_KEY" "LLM_DEMO_API_KEY" "LLM_EVAL_GATEWAY_KEY" "OPENROUTER_API_KEY" }}
  {{- with (get $c $k) }}
  {{ $k }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
