{{- if .Values.lawWatch.enabled }}
# Strażnik zmian w prawie (koncept D1): czy po dacie stanu prawnego korpusu weszły w życie nowelizacje.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "raglab.fullname" . }}-law-watch
  labels: {{- include "raglab.labels" . | nindent 4 }}
    app.kubernetes.io/component: law-watch
spec:
  schedule: {{ .Values.lawWatch.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {{- include "raglab.selector" (dict "ctx" . "component" "law-watch") | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          automountServiceAccountToken: false
          {{- include "raglab.podIdentity" . | nindent 10 }}
          containers:
            - name: law-watch
              image: {{ include "raglab.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "raglab.law_watch"]
              env: [{name: RAGLAB_LAW_WATCH, value: /data/law_watch.json}]
              securityContext: {{- toYaml .Values.securityContext | nindent 16 }}
              resources: {{- toYaml .Values.lawWatch.resources | nindent 16 }}
              volumeMounts: {{- include "raglab.dataMounts" . | nindent 16 }}
          volumes: {{- include "raglab.dataVolumes" . | nindent 12 }}
{{- end }}
