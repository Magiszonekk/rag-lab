apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raglab.fullname" . }}-api
  labels: {{- include "raglab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  # wolumen RWO: nowy pod nie może wystartować obok starego na innym węźle — Recreate zamiast RollingUpdate
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "raglab.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "raglab.selector" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      initContainers:
        # korpus buduje Job ingestu; API czeka, aż pliki pojawią się na wolumenie (pierwsza instalacja)
        - name: wait-for-corpus
          image: {{ include "raglab.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "until [ -f /data/corpus/op.json ] && [ -f /data/corpus/vat.json ] && [ -f /data/corpus/pit.json ]; do echo czekam na korpus; sleep 5; done"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: api
          image: {{ include "raglab.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "raglab.api:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--workers", "1",
                 "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          envFrom: [{configMapRef: {name: {{ include "raglab.fullname" . }}-api}}]
          env: {{- include "raglab.appEnv" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
          # gotowość = działa wyszukiwanie (korpus wczytany, indeks BM25 zbudowany), nie tylko proces
          readinessProbe:
            httpGet: {path: "/search?q=stawka%20podatku&k=1", port: http}
            periodSeconds: 15
            timeoutSeconds: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts: {{- include "raglab.dataMounts" . | nindent 12 }}
      volumes: {{- include "raglab.dataVolumes" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raglab.fullname" . }}-api
  labels: {{- include "raglab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "raglab.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports: [{name: http, port: 80, targetPort: http}]
