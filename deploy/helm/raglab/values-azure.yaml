# Nakładka dla AKS (M4). Wartości z outputów Terraform podaje workflow `azure` przez --set:
#   image.repository, azure.keyVault.{name,tenantId,clientId}, ingress.host, litellm.upstreamBaseUrl
image:
  pullPolicy: IfNotPresent

api:
  # wyszukiwanie jak w demo i w serii wyników: Qwen3-Embedding-8B przez OpenRouter (provider przypięty), klucz z Key Vault
  # (OPENROUTER-API-KEY). Wektory korpusu liczy Job ingestu przez API (minuty zamiast ~17 min mmlw na CPU).
  embed: qwen3-8b
  # bez zapasu mmlw: zapas liczy przy starcie API wektory całego korpusu lokalnie (~17 min CPU na 2 vCPU, każdy nowy pod);
  # gdy OpenRouter nie odpowiada, pytanie kończy się błędem zamiast cichej zmiany metody wyszukiwania
  embedFallback: false
  liveEnabled: true
  perDay: 100
  corsOrigins: "https://rag.cikowice.pl"

ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com   # nginx zarządzany przez AKS (web_app_routing)
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "240"
    # certyfikat Let's Encrypt (HTTP-01) przez cert-manager; ClusterIssuer `letsencrypt` zakłada workflow
    cert-manager.io/cluster-issuer: letsencrypt
    # limit zapytań na IP jak odczyty na serwerze domowym (60/min); pytania ogranicza API (dziennie i na IP/godz.)
    nginx.ingress.kubernetes.io/limit-rpm: "60"
  # host i tls[].hosts podaje workflow (--set ingress.host=…, ingress.tls[0].hosts[0]=…)
  tls:
    - secretName: raglab-tls
      hosts: []

data:
  storageClass: managed-csi       # Azure Disk (Standard SSD)
postgres:
  storageClass: managed-csi

litellm:
  # modele przez tunel WireGuard do bramki modeli (konfiguracja peera w Key Vault: WIREGUARD-CONF)
  upstreamBaseUrl: http://127.0.0.1:8317/v1
  tunnel:
    enabled: true

secrets:
  existingSecret: raglab-kv       # synchronizowany z Key Vault przez sterownik CSI

azure:
  keyVault:
    enabled: true
