[project]
name = "raglab"
version = "0.1.0"
description = "Przejrzysty RAG na polskich ustawach podatkowych: warianty, ewaluacja, ślady"
authors = [
    { name = "Magiszonek", email = "magiszonekxd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.15",
    "httpx>=0.28.1",
    "morfeusz2>=1.99.15",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "spacy>=3.8.16",
]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # polskie znaki typograficzne („ ” – ‒) są zamierzone

[tool.ruff.lint.per-file-ignores]
# dane (pytania, wzorce, listy) w kodzie — długie polskie zdania czytelniej w jednej linii
"src/raglab/evalsets/golden_build.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["raglab.ingest.pdf_lines", "raglab.ingest.tables"]
disallow_untyped_calls = false  # PyMuPDF / pdfplumber nie mają pełnych typów

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch tylko w wersji CPU (serwer i CI bez GPU; wersja CUDA to ~5 GB zależności)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
