[project]
name = "raglab"
version = "0.1.0"
description = "Przejrzysty RAG na polskich ustawach podatkowych: warianty, ewaluacja, ślady"
authors = [
    { name = "Magiszonek", email = "magiszonekxd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # polskie znaki typograficzne („ ” – ‒) są zamierzone

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["raglab.ingest.pdf_lines", "raglab.ingest.tables"]
disallow_untyped_calls = false  # PyMuPDF / pdfplumber nie mają pełnych typów

[tool.pytest.ini_options]
testpaths = ["tests"]
